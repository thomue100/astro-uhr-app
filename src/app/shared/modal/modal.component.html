<!-- src/app/shared/modal/modal.component.html -->
<div class="modal-overlay" (click)="onClose()">
  <div
    #inhalt
    class="modal-content"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title() ? titelId : null"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown.tab)="fokusImFenster($event)"
    (keydown.shift.tab)="fokusImFenster($event)"
  >

    @if (title()) {
    <div class="modal-header">
      <h2 class="modal-title" [id]="titelId">{{ title() }}</h2>
      <button #schliessen type="button" class="modal-close" [attr.aria-label]="'modal.close' | translate" (click)="onClose()">×</button>
    </div>
    <hr />
    }

    <div class="modal-body">
      <ng-content />
    </div>

    <div class="modal-footer">
      <ng-content select="[modal-footer]" />
    </div>
  </div>
</div>
