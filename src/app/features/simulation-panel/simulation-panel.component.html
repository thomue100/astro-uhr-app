<!-- src/app/features/simulation-panel/simulation-panel.component.html -->
<label for="dateTimeInput">{{ 'simulation.date_label' | translate }}</label>
<input
  type="datetime-local"
  id="dateTimeInput"
  min="1911-01-01T00:00"
  max="2080-12-31T23:59"
  [ngModel]="selectedDateTimeString()"
  (ngModelChange)="selectedDateTimeString.set($event); onDateTimeChange()"
/>

<div id="liveDateTime">
  {{ anzeige().wochentag }}, <span class="live-zeitpunkt">{{ anzeige().zeitpunkt }}</span><span class="live-zone">{{ 'simulation.zone' | translate }}</span>
</div>

<label for="speedSlider">
  {{ 'simulation.speed_label' | translate }}
  {{ geschwindigkeit() }}
</label>
<input
  type="range"
  id="speedSlider"
  [attr.aria-valuetext]="geschwindigkeit()"
  min="0.1"
  max="5"
  step="0.1"
  [ngModel]="animationSpeed()"
  (ngModelChange)="animationSpeed.set(+$event); onSpeedChange()"
/>

<!-- Start/Anhalten und „Jetzt“ (Zeit auf jetzt) platzsparend nebeneinander;
     dieselben Begriffe wie im 3D-Modell. -->
<div class="btn-row">
  <button (click)="toggleAnimation()">
    <span class="mit-symbol"><app-symbol [name]="isAnimationRunning() ? 'pause' : 'start'" />{{ isAnimationRunning()
    ? ('simulation.anim_stop'  | translate)
    : ('simulation.anim_start' | translate) }}</span>
  </button>
  <button (click)="setToCurrentTime()">
    {{ 'simulation.reset' | translate }}
  </button>
</div>
