<!-- src/app/features/controls/panels/simulation-panel/simulation-panel.component.html -->
<label for="dateTimeInput">Datum und Uhrzeit:</label>
<input
  type="datetime-local"
  id="dateTimeInput"
  min="1911-01-01T00:00"
  max="2080-12-31T23:59"
  [ngModel]="selectedDateTimeString()"
  (ngModelChange)="selectedDateTimeString.set($event); onDateTimeChange()"
/>

<div id="liveDateTime">
  {{ currentDate() | date: 'dd.MM.yyyy HH:mm:ss' }}
</div>

<button (click)="setToCurrentTime()">⏱️ Aktuelle Zeit</button>

<label for="speedSlider">
  Geschwindigkeit: {{ animationSpeed() | number: '1.1-1' }}x
</label>
<input
  type="range"
  id="speedSlider"
  min="0.1"
  max="5"
  step="0.1"
  [ngModel]="animationSpeed()"
  (ngModelChange)="animationSpeed.set(+$event); onSpeedChange()"
/>

<button (click)="toggleAnimation()">
  {{ isAnimationRunning() ? '⏸️ Animation stoppen' : '▶️ Animation starten' }}
</button>
