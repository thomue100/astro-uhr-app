<!-- src/app/features/simulation-panel/simulation-panel.component.html -->
<label for="dateTimeInput">{{ 'simulation.date_label' | translate }}</label>
<input
  type="datetime-local"
  id="dateTimeInput"
  min="1911-01-01T00:00"
  max="2080-12-31T23:59"
  [ngModel]="selectedDateTimeString()"
  (ngModelChange)="selectedDateTimeString.set($event); onDateTimeChange()"
/>

<div id="liveDateTime">
  {{ currentDate() | date: 'dd.MM.yyyy HH:mm:ss' }}
</div>

<!-- Fix "Buttons schmaler": btn-auto macht den Button inhaltsbreit statt
     100% breit und verhindert per white-space:nowrap gleichzeitig, dass
     unterschiedlich lange DE/EN-Texte umbrechen (kein Höhensprung). -->
<button class="btn-auto" (click)="setToCurrentTime()">
  {{ 'simulation.current_time' | translate }}
</button>

<label for="speedSlider">
  {{ 'simulation.speed_label' | translate }}
  {{ animationSpeed() | number: '1.1-1' }}x
</label>
<input
  type="range"
  id="speedSlider"
  min="0.1"
  max="5"
  step="0.1"
  [ngModel]="animationSpeed()"
  (ngModelChange)="animationSpeed.set(+$event); onSpeedChange()"
/>

<button class="btn-auto" (click)="toggleAnimation()">
  {{ isAnimationRunning()
  ? ('simulation.anim_stop'  | translate)
  : ('simulation.anim_start' | translate) }}
</button>
