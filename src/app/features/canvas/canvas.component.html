<!-- src/app/features/canvas/canvas.component.html -->
<div class="canvas-wrapper">
  <div
    class="canvas-container"
    [class.canvas-container--interactive]="showCalendarControls()"
  >
    <canvas
      #canvasElement
      id="canvas"
      [class.canvas-rotate]="showCalendarControls() && interactionMode() === 'rotate'"
      [class.canvas-pan]="showCalendarControls() && interactionMode() === 'pan'"
      (mousedown)="onCanvasMouseDown($event)"
      (mousemove)="onCanvasMouseMove($event)"
      (mouseup)="onCanvasMouseUp()"
      (mouseleave)="onCanvasMouseLeave()"
      (wheel)="onCanvasWheel($event)"
      (touchstart)="onCanvasTouchStart($event)"
      (touchmove)="onCanvasTouchMove($event)"
      (touchend)="onCanvasTouchEnd($event)"
    ></canvas>

    <!--
      Fix "Mobile Optimierung": Auf Mobile ist dieser dezente Reset-Button
      unten rechts die EINZIGE sichtbare Kalenderscheiben-Steuerung. Drehen
      geschieht per Ein-Finger-Drag direkt auf der Scheibe, Zoom+Verschieben
      per Zwei-Finger-Pinch - beides war schon vorher implementiert, macht
      dedizierte Dreh-/Verschiebe-Buttons also überflüssig.
    -->
    <button
      class="cc-reset-corner"
      [class.cc-reset-corner--visible]="showCalendarControls()"
      (click)="resetView()"
      [title]="'calendar_disk.reset' | translate"
    >⟲</button>

    <!--
      Erweiterte Steuerung (Zoom-Buttons, Dreh-/Verschiebe-Modus):
      nur ab Tablet/Desktop sichtbar (siehe CSS) - dort fehlen Touch-Gesten,
      daher bleiben diese Buttons dort die einzige Zoom-/Modus-Möglichkeit.
    -->
    <div
      class="calendar-controls-bar"
      [class.calendar-controls-bar--visible]="showCalendarControls()"
    >
      <button class="cc-btn" (click)="zoomOut()" [title]="'calendar_disk.zoom_out' | translate">🔍−</button>
      <button class="cc-btn" (click)="zoomIn()"  [title]="'calendar_disk.zoom_in'  | translate">🔍+</button>
      <div class="cc-separator"></div>
      <button
        class="cc-btn cc-mode-btn"
        [class.cc-mode-btn--active]="interactionMode() === 'rotate'"
        [title]="'calendar_disk.mode_rotate' | translate"
        (click)="setMode('rotate')"
      >⟳</button>
      <button
        class="cc-btn cc-mode-btn"
        [class.cc-mode-btn--active]="interactionMode() === 'pan'"
        [title]="'calendar_disk.mode_pan' | translate"
        (click)="setMode('pan')"
      >✥</button>
    </div>
  </div>
</div>
