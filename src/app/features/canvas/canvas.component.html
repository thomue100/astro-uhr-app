<!-- src/app/features/canvas/canvas.component.html -->
<div class="canvas-wrapper">
  <div
    class="canvas-container"
    [class.canvas-container--interactive]="showCalendarControls()"
  >
    <canvas
      #canvasElement
      id="canvas"
      [class.canvas-rotate]="showCalendarControls() && interactionMode() === 'rotate'"
      [class.canvas-pan]="showCalendarControls() && interactionMode() === 'pan'"
      (mousedown)="onCanvasMouseDown($event)"
      (mousemove)="onCanvasMouseMove($event)"
      (mouseup)="onCanvasMouseUp()"
      (mouseleave)="onCanvasMouseLeave()"
      (wheel)="onCanvasWheel($event)"
      (touchstart)="onCanvasTouchStart($event)"
      (touchmove)="onCanvasTouchMove($event)"
      (touchend)="onCanvasTouchEnd($event)"
    ></canvas>

    <!--
      Steuerleiste bewusst minimal gehalten:
      - Keine ↺/↻ Schritt-Buttons mehr: freies Drehen per Drag (Maus UND
        Touch) deckt das bereits vollständig ab, ein diskreter Schritt-
        Button wäre redundant und würde nur unnötig Platz kosten.
      - Nur Icons, keine Textlabel: die Symbole sind selbsterklärend
        (Lupe = Zoom, Kreispfeil = Drehen, Kreuzpfeile = Verschieben,
        Rückwärtspfeil = Reset), der volle Begriff steht als Tooltip.
      - Zoom-Buttons bleiben nur ab Tablet/Desktop sichtbar, da Mobile
        natives Pinch-to-Zoom nutzt (siehe canvas.component.css).
      Ergebnis: auf Mobile bleiben nur 3 schmale Icon-Buttons übrig,
      die Kalenderscheibe wird kaum noch verdeckt.
    -->
    <div
      class="calendar-controls-bar"
      [class.calendar-controls-bar--visible]="showCalendarControls()"
    >
      <button class="cc-btn cc-zoom-btn" (click)="zoomOut()" [title]="'calendar_disk.zoom_out' | translate">🔍−</button>
      <button class="cc-btn cc-zoom-btn" (click)="zoomIn()"  [title]="'calendar_disk.zoom_in'  | translate">🔍+</button>
      <div class="cc-separator cc-zoom-separator"></div>

      <button
        class="cc-btn cc-mode-btn"
        [class.cc-mode-btn--active]="interactionMode() === 'rotate'"
        [title]="'calendar_disk.mode_rotate' | translate"
        (click)="setMode('rotate')"
      >⟳</button>
      <button
        class="cc-btn cc-mode-btn"
        [class.cc-mode-btn--active]="interactionMode() === 'pan'"
        [title]="'calendar_disk.mode_pan' | translate"
        (click)="setMode('pan')"
      >✥</button>
      <div class="cc-separator"></div>

      <button class="cc-btn" (click)="resetView()" [title]="'calendar_disk.reset' | translate">⟲</button>
    </div>
  </div>
</div>
