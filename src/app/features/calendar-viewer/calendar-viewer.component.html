<div class="cv-overlay" (click)="onClose()">
  <div class="cv-dialog" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="cv-header">
      <span class="cv-title">🗓️ Kalenderscheibe – Interaktiver Viewer</span>
      <div class="cv-header-hint">Ziehen zum Verschieben · Mausrad / Pinch zum Zoomen</div>
      <button class="cv-close-btn" (click)="onClose()" title="Schließen">✕</button>
    </div>

    <!-- Canvas-Bereich -->
    <div class="cv-canvas-container" #container>
      <canvas
        #viewerCanvas
        class="cv-canvas"
        [class.cv-dragging]="false"
        (mousedown)="onMouseDown($event)"
        (mousemove)="onMouseMove($event)"
        (mouseup)="onMouseUp()"
        (mouseleave)="onMouseLeave()"
        (wheel)="onWheel($event)"
        (touchstart)="onTouchStart($event)"
        (touchmove)="onTouchMove($event)"
        (touchend)="onTouchEnd($event)"
      ></canvas>
    </div>

    <!-- Footer mit Buttons -->
    <div class="cv-footer">
      <button class="cv-btn" (click)="zoomOut()" title="Verkleinern">🔍−</button>
      <button class="cv-btn" (click)="zoomIn()" title="Vergrößern">🔍+</button>
      <button class="cv-btn" (click)="resetView()" title="Ansicht zurücksetzen">⟲ Reset</button>
      <button class="cv-btn cv-btn-close" (click)="onClose()">✕ Schließen</button>
    </div>

  </div>
</div>
