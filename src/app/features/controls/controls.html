<div class="controls">

  <h2 class="app-title">
    Astronomische Uhr - St. Marien zu Lübeck
  </h2>

  <!-- Einführung -->
  <div class="controls-header top-rounded"
       (click)="openModal('info')">
    ℹ️ Einführung
  </div>

  <!-- Simulation -->
  <div class="controls-header middle">
    ▶ Simulation
  </div>

  <div class="controls-content">
    ...
  </div>

  <!-- Kalender -->
  <div class="controls-header middle">
    ▼ Kalender
  </div>

  <div class="controls-content">
    ...

    <button class="controls-button"
            (click)="openModal('calendar')">
      ℹ️ Erläuterungen
    </button>

  </div>

  <!-- Kunst & Geschichte -->
  <div class="controls-header bottom-rounded"
       (click)="openModal('history')">
    ℹ️ Kunst & Geschichte
  </div>

</div>

<!-- ✅ Overlays -->
<app-modal
  *ngIf="activeModal === 'info'"
  title="Die Astronomische Uhr 🧭"
  (close)="closeModal()">

  <app-info-modal-content></app-info-modal-content>
  <div modal-footer>
    <button (click)="closeModal()">Schließen</button>
  </div>

</app-modal>


<app-modal
  *ngIf="activeModal === 'calendar'"
  [title]="'Wochentags-Rechengang für den ' + (selectedDate | date:'dd.MM.yyyy') + ' 🗓️'"
  (close)="closeModal()">

  <app-calendar-modal
    [date]="selectedDate">
  </app-calendar-modal>

  <div modal-footer>
    <button (click)="closeModal()">Schließen</button>
  </div>

</app-modal>


<app-modal
  *ngIf="activeModal === 'history'"
  title="Kunst & Geschichte der Astronomischen Uhr 📜"
  (close)="closeModal()">

  <app-history-modal-content/>

  <div modal-footer>
    <button (click)="closeModal()">Schließen</button>
  </div>
</app-modal>
