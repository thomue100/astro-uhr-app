<!-- src/app/features/controls/controls.component.html -->
<div class="controls" id="controls">
  <h2 class="app-title">Astronomische Uhr - St. Marien zu Lübeck</h2>

  <div class="controls-header" id="infoButtonHeader" (click)="openModal('info')">
    ℹ️ Einführung
  </div>

  <!-- Simulation Panel -->
  <div id="simulationPanel">
    <div class="controls-header" (click)="openSimulation()">
      {{ isSimulationOpen ? '🔽' : '▶️' }} Simulation
    </div>
    <div
      class="controls-content"
      [class.controls-content--hidden]="!isSimulationOpen"
    >
      <app-simulation-panel />
    </div>
  </div>

  <!-- Kalender Panel -->
  <div id="calendarPanel">
    <div class="controls-header" (click)="openCalendar()">
      {{ isCalendarOpen ? '🔽' : '▶️' }} Kalender
    </div>
    <div
      class="controls-content"
      [class.controls-content--hidden]="!isCalendarOpen"
    >
      <app-calendar-panel (openCalendarModal)="openModal('calendar')" />
    </div>
  </div>

  <!-- Kunst & Geschichte -->
  <div id="historyPanel">
    <div class="controls-header" (click)="openModal('history')">
      ℹ️ Kunst & Geschichte
    </div>
  </div>
</div>

<!-- Modals -->
@if (activeModal() === 'info') {
<app-modal title="Die Astronomische Uhr 🧭" (close)="closeModal()">
  <app-info-modal-content />
  <div modal-footer>
    <button (click)="closeModal()">Schließen</button>
  </div>
</app-modal>
}

@if (activeModal() === 'calendar') {
<app-modal
  [title]="'Wochentags-Rechengang für den ' + (currentDate() | date: 'dd.MM.yyyy') + ' 🗓️'"
  (close)="closeModal()"
>
  <app-calendar-modal [date]="currentDate()" />
  <div modal-footer>
    <button (click)="closeModal()">Schließen</button>
  </div>
</app-modal>
}

@if (activeModal() === 'history') {
<app-modal title="Kunst & Geschichte der Astronomischen Uhr 📜" (close)="closeModal()">
  <app-history-modal-content />
  <div modal-footer>
    <button (click)="closeModal()">Schließen</button>
  </div>
</app-modal>
}
