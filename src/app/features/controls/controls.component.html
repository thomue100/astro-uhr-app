<!-- src/app/features/controls/controls.component.html -->
<div class="controls" id="controls">

  @if (m3d.active()) {
  <!-- 3D-Modell offen: Bedienfeld ersetzt das Menü, Titelzeile bleibt stehen -->
  <button type="button" class="controls-header m3d-back" (click)="close3d()">
    {{ 'model3d.back' | translate }}
  </button>
  <app-model3d-panel />
  } @else {
  <button type="button" class="controls-header" id="infoButtonHeader" aria-haspopup="dialog" (click)="openModal('info')">
    {{ 'nav.intro' | translate }}
  </button>

  <!-- Simulation Panel -->
  <div id="simulationPanel">
    <button type="button" class="controls-header" [attr.aria-expanded]="isSimulationOpen" aria-controls="simulationContent" (click)="openSimulation()">
      <span><span aria-hidden="true">{{ isSimulationOpen ? '🔽' : '▶️' }}</span> {{ 'nav.simulation' | translate }}</span>
    </button>
    <div class="controls-content" id="simulationContent" [class.controls-content--hidden]="!isSimulationOpen" [inert]="!isSimulationOpen">
      <app-simulation-panel />
    </div>
  </div>

  <!-- Kalender Panel -->
  <div id="calendarPanel">
    <button type="button" class="controls-header" [attr.aria-expanded]="isCalendarOpen" aria-controls="calendarContent" (click)="openCalendar()">
      <span><span aria-hidden="true">{{ isCalendarOpen ? '🔽' : '▶️' }}</span> {{ 'nav.calendar' | translate }}</span>
    </button>
    <div class="controls-content" id="calendarContent" [class.controls-content--hidden]="!isCalendarOpen" [inert]="!isCalendarOpen">
      <app-calendar-panel (openCalendarModal)="openModal('calendar')" />
    </div>
  </div>

  <!-- Das 3D-Modell öffnet der Umschalter über dem Rahmen (app-canvas) –
       bewusst kein eigener Menüpunkt, damit es nur einen Weg gibt. -->

  <!-- Kunst & Geschichte -->
  <div id="historyPanel">
    <button type="button" class="controls-header" aria-haspopup="dialog" (click)="openModal('history')">
      {{ 'nav.history' | translate }}
    </button>
  </div>
  }

</div>

<!-- Modals -->
@if (activeModal() === 'info') {
  <app-modal [title]="'modal_intro.title' | translate" (close)="closeModal()">
    <app-info-modal-content />
    <div modal-footer>
      <button (click)="closeModal()">{{ 'modal.close' | translate }}</button>
    </div>
  </app-modal>
}

@if (activeModal() === 'calendar') {
  <app-modal
    [title]="('modal_calendar.weekday_title' | translate) + ' ' + (currentDate() | date:'dd.MM.yyyy') + ' 🗓️'"
    (close)="closeModal()"
  >
    <app-calendar-modal [date]="currentDate()" />
    <div modal-footer>
      <button (click)="closeModal()">{{ 'modal.close' | translate }}</button>
    </div>
  </app-modal>
}

@if (activeModal() === 'history') {
  <app-modal [title]="'modal_history.title' | translate" (close)="closeModal()">
    <app-history-modal-content />
    <div modal-footer>
      <button (click)="closeModal()">{{ 'modal.close' | translate }}</button>
    </div>
  </app-modal>
}
